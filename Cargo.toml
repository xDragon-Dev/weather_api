[package]
name = "weather_api"
version = "0.1.0"
edition = "2024"

[dependencies]
# Password hashing functionality
argon2 = "0.6.0"

# REST API, routing and request handling library
axum = "0.8.9"

# Date and time library
time = { version = "0.3.55", features = ["serde-human-readable"] }

# Support for .env file
dotenvy = "0.15.7"

# Regular expressions for Rust
validator = { version = "0.21.0", features = ["derive"] }
regex = "1.13.1"

# Serialization/deserialization framework
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
csv = "1.4.0"

# Rust SQL Toolkit
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "derive", "uuid", "time"] }

# Async runtime
tokio = { version = "1.54.1", features = ["full"] }

# A library to generate and parse UUIDs
uuid = { version = "1.29.3", features = ["v7","serde"] }

#Log utility
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

#Seions and permisions
pasetors = "0.8.1"
